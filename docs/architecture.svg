<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-sans-serif,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <style>
    .lane{fill:#131824;stroke:#2b3350;stroke-width:1.5}
    .label{fill:#e6eaf2;font-weight:700;font-size:15px}
    .sub{fill:#8b95ab;font-size:11px}
    .broker{fill:#17203a;stroke:#5b8cff;stroke-width:2}
    .host{fill:none;stroke:#394465;stroke-dasharray:6 5;stroke-width:1.5}
    .arrow{stroke:#5b8cff;stroke-width:2;fill:none;marker-end:url(#a)}
    .xno{stroke:#e5564e;stroke-width:2;stroke-dasharray:5 4;fill:none}
    .tag{fill:#9fb0d0;font-size:10.5px}
    .title{fill:#e6eaf2;font-size:17px;font-weight:700}
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b8cff"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="460" fill="#0b0e14"/>
  <text x="30" y="34" class="title">Chakravyuh — sealed arena architecture</text>

  <!-- shared host boundary -->
  <rect x="24" y="52" width="852" height="330" rx="14" class="host"/>
  <text x="40" y="74" class="tag">shared host kernel &amp; container runtime  (residual risk — see threat model)</text>

  <!-- broker center -->
  <rect x="360" y="150" width="190" height="150" rx="12" class="broker"/>
  <text x="455" y="178" text-anchor="middle" class="label">BROKER</text>
  <text x="455" y="198" text-anchor="middle" class="sub">sole bridge</text>
  <text x="372" y="222" class="tag">• default-deny policy</text>
  <text x="372" y="240" class="tag">• capability tokens</text>
  <text x="372" y="258" class="tag">• commit-reveal</text>
  <text x="372" y="276" class="tag">• latency padding</text>
  <text x="372" y="294" class="tag">• signed audit log</text>

  <!-- red -->
  <rect x="60" y="150" width="190" height="150" rx="12" class="lane"/>
  <text x="155" y="178" text-anchor="middle" class="label">RED</text>
  <text x="155" y="198" text-anchor="middle" class="sub">rootless · seccomp</text>
  <text x="72" y="226" class="tag">attack agent</text>
  <text x="72" y="244" class="tag">commits payload hash</text>
  <text x="72" y="262" class="tag">net-red (internal)</text>

  <!-- blue -->
  <rect x="660" y="80" width="190" height="120" rx="12" class="lane"/>
  <text x="755" y="106" text-anchor="middle" class="label">BLUE</text>
  <text x="755" y="126" text-anchor="middle" class="sub">rootless · seccomp</text>
  <text x="672" y="152" class="tag">defensive guard</text>
  <text x="672" y="170" class="tag">verdict only · net-blue</text>

  <!-- model -->
  <rect x="660" y="250" width="190" height="120" rx="12" class="lane"/>
  <text x="755" y="276" text-anchor="middle" class="label">MODEL</text>
  <text x="755" y="296" text-anchor="middle" class="sub">ephemeral session</text>
  <text x="672" y="322" class="tag">no KV / context carryover</text>
  <text x="672" y="340" class="tag">net-model (internal)</text>

  <!-- arrows broker<->lanes -->
  <path class="arrow" d="M250,210 L360,210"/>
  <path class="arrow" d="M360,205 L250,205" transform="translate(0,-0)"/>
  <path class="arrow" d="M550,190 L660,150"/>
  <path class="arrow" d="M550,255 L660,300"/>

  <!-- forbidden red->blue / red->model -->
  <path class="xno" d="M200,150 C260,70 600,70 700,80"/>
  <text x="430" y="92" text-anchor="middle" class="tag" fill="#e5564e">red → blue : no route</text>
  <path class="xno" d="M200,300 C300,392 600,392 700,360"/>
  <text x="440" y="410" text-anchor="middle" class="tag" fill="#e5564e">red → model : only via broker</text>

  <!-- output -->
  <text x="455" y="330" text-anchor="middle" class="tag">↓ signed isolation report + canary leakage score</text>
  <text x="455" y="348" text-anchor="middle" class="sub">independently verifiable attestation</text>
</svg>
